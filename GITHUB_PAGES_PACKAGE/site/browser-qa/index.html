<!doctype html><html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sports Simulator | Browser QA</title>
<style>
:root{color-scheme:dark;background:#292b29;color:#f6f6f0;
font:14px system-ui,Arial}
*{box-sizing:border-box}
body{margin:0}
main{max-width:950px;margin:auto;padding:25px 17px 60px}
a{color:#83e8ed}
h1{font-size:clamp(28px,5vw,43px)}
button{background:#b9fb70;color:#142017;
font:inherit;font-weight:800;padding:12px 17px;
border:0;border-radius:10px;cursor:pointer}
.panel{background:#383b37;border:1px solid #575c54;
padding:18px;border-radius:14px;margin:14px 0}
.pass{color:#b9fb70}.fail{color:#ffb5a9}
iframe{width:100%;height:420px;border:1px solid #575c54;
border-radius:12px}
</style></head><body><main>
<a href="../">← Beta website</a>
<h1>Real Chrome interaction QA</h1>
<p>This test opens the actual beta, manipulates its filters and
matches, and checks rendered probabilities.</p>
<button id="run">Run browser tests</button>
<div class="panel">
<h2 id="summary">Tests not started</h2>
<div id="results"></div>
</div>
<iframe id="site" title="Beta under test" src="../"></iframe>
<script>
const $=id=>document.getElementById(id);
const sleep=t=>new Promise(r=>setTimeout(r,t));
async function execute(){
 $('summary').textContent='Running browser checks...';
 $('results').replaceChildren();
 const frame=$('site');
 const w=frame.contentWindow;
 let d;
 const checks=[];
 function check(label,fn){
  try{checks.push({label,pass:Boolean(fn())})}
  catch(e){checks.push({label,pass:false,error:String(e)})}
 }
 for(let i=0;i<40;i++){
  try{
   d=w.document;
   if(d.querySelector('#metrics .metric')&&
      d.querySelectorAll('#cards .card').length===290)break;
  }catch(e){}
  await sleep(150);
 }
 d=w.document;

 check('Beta metrics loaded',()=>d.querySelectorAll(
  '#metrics .metric').length>=5);
 check('290 saved match cards render',()=>d.querySelectorAll(
  '#cards .card').length===290);

 const input=d.querySelector('#query');
 input.value='__NO_MATCH_EXPECTED__';
 input.dispatchEvent(new Event('input',{bubbles:true}));
 check('Search removes nonmatching cards',()=>
  d.querySelectorAll('#cards .card').length===0);

 input.value='';
 input.dispatchEvent(new Event('input',{bubbles:true}));
 check('Search restores all cards',()=>
  d.querySelectorAll('#cards .card').length===290);

 const league=d.querySelector('#league');
 if(league.options.length>1){
  league.value=league.options[1].value;
  league.dispatchEvent(new Event('change',{bubbles:true}));
 }
 check('League selection actually filters',()=>
  league.options.length>1&&
  d.querySelectorAll('#cards .card').length>0&&
  d.querySelectorAll('#cards .card').length<290);

 league.value='';
 league.dispatchEvent(new Event('change',{bubbles:true}));

 const first=d.querySelector('#cards .card button');
 if(first)first.click();
 check('Match detail opens',()=>
  !d.querySelector('#detail').classList.contains('hidden'));
 check('Saved match details render 1X2 bars',()=>
  d.querySelectorAll('#detail .fill').length===3);

 d.querySelector('#close').click();

 d.querySelector('[data-tab="ucl"]').click();
 check('18 UCL archive cards render',()=>
  d.querySelectorAll('#cards .card').length===18);

 const uclButton=d.querySelector('#cards .card button');
 if(uclButton)uclButton.click();
 check('UCL detail opens',()=>
  !d.querySelector('#detail').classList.contains('hidden'));
 check('UCL 1X2 bars render',()=>
  d.querySelectorAll('#detail .fill').length>=3);

 d.querySelector('#close').click();
 d.querySelector('[data-tab="schedule"]').click();
 check('55 schedule entries render',()=>
  d.querySelectorAll('#cards .card').length===55);

 d.querySelector('[data-tab="experimental"]').click();
 check('Seven experimental cards render',()=>
  d.querySelectorAll('#cards .card').length===7);

 const experimentalButton=d.querySelector('#cards .card button');
 if(experimentalButton)experimentalButton.click();
 check('Experimental markets render five bars',()=>
  d.querySelectorAll('#detail .fill').length===5);

 const pass=checks.filter(x=>x.pass).length;
 $('summary').textContent=pass+' / '+checks.length+
  ' real browser checks passed';
 checks.forEach(x=>{
  const p=document.createElement('p');
  p.className=x.pass?'pass':'fail';
  p.textContent=(x.pass?'PASS':'FAIL')+' · '+x.label+
   (x.error?' · '+x.error:'');
  $('results').append(p);
 });
}
$('run').onclick=()=>execute().catch(e=>{
 $('summary').textContent='Test error: '+e.message;
});
</script></body></html>
