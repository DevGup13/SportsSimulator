<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sports Simulator · Player History</title><style>body{margin:0;background:#292b29;color:#f5f6f0;font:15px system-ui}main{max-width:980px;margin:auto;padding:22px}a{color:#8ae6ea}h1{color:#baff70}input{background:#383c38;border:1px solid #777;color:#fff;border-radius:9px;padding:12px;width:min(90%,530px)}.notice,.card{background:#373d36;border:1px solid #596355;border-radius:12px;padding:14px;margin:9px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}small{color:#c6c9c2}button{background:#baff70;border:0;border-radius:7px;padding:9px}</style><main><a href="../">← Sports Simulator</a><h1>⚽ Historical Player Stats Lab</h1><div class="notice">ESPN source-labeled raw historical values ONLY. No verified minutes, per-90 rates, independently certified field meanings, or player prop probabilities.</div><input id="q" placeholder="Search player, team, league"><p id="count"></p><div class="grid" id="cards"></div><section id="detail" class="card" hidden></section><script>const $=x=>document.getElementById(x);let rows=[];function detail(x){let d=$('detail');d.hidden=false;d.replaceChildren();let h=document.createElement('h2');h.textContent=x.name+' · '+x.club;d.append(h);let p=document.createElement('p');p.textContent=x.event_count+' unique archived events · '+x.approved_rows+' approved-stat rows';d.append(p);for(const [k,v] of Object.entries(x.raw_fields)){let line=document.createElement('p');line.textContent=k+': '+v.sum+' raw sum / '+v.n+' records · unverified meaning';d.append(line)}}function render(){const q=$('q').value.toLowerCase();const f=rows.filter(x=>(x.name+' '+x.club+' '+x.league).toLowerCase().includes(q));$('count').textContent=f.length+' player matches';$('cards').replaceChildren();for(const x of f.slice(0,120)){let c=document.createElement('div');c.className='card';let h=document.createElement('h3');h.textContent=x.name;let p=document.createElement('small');p.textContent=x.club+' · '+x.event_count+' events';let b=document.createElement('button');b.textContent='Inspect raw history';b.onclick=()=>detail(x);c.append(h,p,b);$('cards').append(c)}}$('q').oninput=render;fetch('../player-history.json').then(r=>{if(!r.ok)throw Error('Data unavailable');return r.json()}).then(d=>{rows=d.players;render()}).catch(e=>$('count').textContent=e.message);</script></main></html>
