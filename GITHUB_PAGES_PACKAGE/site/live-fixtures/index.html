<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sports Simulator · ESPN Fixtures</title><style>body{margin:0;background:#292b29;color:#fafaf5;font:15px system-ui}main{max-width:970px;margin:auto;padding:22px}a{color:#8ae6ee}h1{color:#baff70}input{padding:12px;background:#363a35;color:white;border:1px solid #777;border-radius:8px}.card,.note{background:#393e38;border:1px solid #586055;padding:14px;border-radius:12px;margin:10px 0}small{color:#c9ceca}</style><main><a href="../">← Beta</a><h1>📡 ESPN Verified-ID Fixtures</h1><p class="note">Source-fetched snapshot, not a live-refresh feed. Historical team identity joins and live forecasts are unverified.</p><p id="time"></p><input id="q" placeholder="Search team or league"><p id="count"></p><div id="cards"></div><script>const $=x=>document.getElementById(x);let rows=[];function render(){let q=$('q').value.toLowerCase();let v=rows.filter(x=>(x.home+' '+x.away+' '+x.league).toLowerCase().includes(q));$('count').textContent=v.length+' upcoming records';$('cards').replaceChildren();for(let x of v){let c=document.createElement('article');c.className='card';let h=document.createElement('h3');h.textContent=x.home+' vs '+x.away;let p=document.createElement('p');p.textContent=x.league+' · '+new Date(x.kickoff_utc).toLocaleString();let n=document.createElement('small');n.textContent='ESPN ID '+x.event_id+' · Team IDs '+x.home_id+'/'+x.away_id+' · Forecast unavailable';c.append(h,p,n);$('cards').append(c)}}$('q').oninput=render;fetch('./data.json').then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(d=>{rows=d.events;$('time').textContent='Fetched '+new Date(d.retrieved_utc).toLocaleString()+' · refresh manually in Colab';render()}).catch(e=>$('count').textContent=e.message);</script></main></html>
