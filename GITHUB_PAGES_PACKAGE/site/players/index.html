<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sports Simulator | Players</title><style>body{margin:0;background:#292b29;color:#f5f5f0;font:15px system-ui}main{max-width:1000px;margin:auto;padding:22px}a{color:#83e8ed}h1{color:#baff70}input{background:#373d36;color:white;padding:13px;border-radius:9px;border:1px solid #596056;width:95%;max-width:500px}#cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.card{background:#393c37;border:1px solid #596056;border-radius:12px;padding:14px}small{color:#c3cec2}.warning{background:#394337;padding:12px;border-left:3px solid #baff70}</style></head><body><main><a href="../">← Sports Simulator</a><h1>👥 Real Player Directory</h1><p class="warning">Historical identity-aligned match logs only. Minutes and simulated player props are unavailable until independently validated.</p><input id="search" placeholder="Search player, club or league" aria-label="Search players"><p id="count"></p><div id="cards"></div><script>const $=x=>document.getElementById(x);let people=[];function render(){const q=$('search').value.toLowerCase();const matches=people.filter(x=>(x.name+' '+x.club+' '+x.league).toLowerCase().includes(q));$('count').textContent=matches.length+' of '+people.length+' aligned players';$('cards').replaceChildren();for(const x of matches.slice(0,180)){const box=document.createElement('div');box.className='card';const h=document.createElement('h3');h.textContent=x.name;const p=document.createElement('small');p.textContent=x.club+' · '+x.league+' · '+x.unique_events+' events · '+x.approved_stat_logs+' approved-stat logs';box.append(h,p);$('cards').append(box)}}$('search').addEventListener('input',render);fetch('../players.json').then(r=>{if(!r.ok)throw Error('Player directory missing');return r.json()}).then(d=>{people=d.records;render()}).catch(e=>$('count').textContent=e.message);</script></main></body></html>
