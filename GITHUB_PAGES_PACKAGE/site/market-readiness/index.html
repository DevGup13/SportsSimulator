<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sports Simulator | Market Readiness</title><style>body{background:#292b29;color:#f5f6f1;font:15px system-ui;margin:0}main{max-width:960px;margin:auto;padding:22px}a{color:#83e8ed}h1{color:#baff70}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #505b50;text-align:left}.warn{background:#394037;padding:13px;border-left:3px solid #baff70}</style><main><a href="../">← Beta</a><h1>🎯 Player Market Readiness</h1><p class="warn">Research only. No player prop is certified or available for betting probabilities.</p><p id="headline">Loading...</p><table><thead><tr><th>Stat</th><th>Present</th><th>Valid integer</th><th>Invalid</th><th>Market</th></tr></thead><tbody id="rows"></tbody></table><p id="issues"></p></main><script>fetch('./report.json').then(r=>{if(!r.ok)throw Error('Report unavailable');return r.json()}).then(d=>{document.getElementById('headline').textContent=d.source_rows.toLocaleString()+' player logs · '+d.approved_aligned_rows+' semantics-approved and aligned rows';for(const [k,v] of Object.entries(d.fields)){let tr=document.createElement('tr');for(const text of [k,v.present||0,v.nonnegative_integer||0,(v.invalid||0)+(v.negative||0)+(v.fractional||0),'UNAVAILABLE']){let td=document.createElement('td');td.textContent=String(text);tr.append(td)}document.getElementById('rows').append(tr)}document.getElementById('issues').textContent='SOG > shots: '+(d.cross_field_checks.SOG_EXCEEDS_SHOT||0)+' · Duplicate player/event pairs: '+d.duplicate_player_event_pairs}).catch(e=>document.getElementById('headline').textContent=e.message);</script></html>
