<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sports Simulator | Fixture Lab</title><style>body{font:15px system-ui;background:#292b29;color:white;margin:0}main{max-width:900px;margin:auto;padding:24px}a{color:#8aeef0}h1{color:#baff70}.card{background:#394038;padding:14px;margin:10px 0;border-radius:12px}select{padding:9px}</style><main><a href="../">← Sports Simulator</a><h1>🎯 Fixture Research Lab</h1><p>⚠ Research probabilities are not calibrated, certified, or million-draw simulations. Exact team names are NOT verified historical provider-ID joins.</p><p id="count"></p><select id="filter"><option value="ALL">All</option><option value="RESEARCH_ONLY">Research candidates</option><option value="REVIEW">Needs review</option></select><div id="cards"></div></main><script>let games=[];const $=x=>document.getElementById(x);function render(){let mode=$('filter').value;let rows=games.filter(x=>mode==='ALL'||x.status===mode);$('count').textContent=rows.length+' fixtures';$('cards').replaceChildren();for(let x of rows){let a=document.createElement('article');a.className='card';let h=document.createElement('strong');h.textContent=x.home+' vs '+x.away;let p=document.createElement('p');p.textContent=x.league+' · '+new Date(x.kickoff_utc).toLocaleString()+' · '+x.status;let d=document.createElement('small');d.textContent=x.status==='RESEARCH_ONLY'?'Uncertified 1X2: '+[x.home_win,x.draw,x.away_win].map(z=>(z*100).toFixed(1)+'%').join(' / '):x.reasons.join(', ');a.append(h,p,d);$('cards').append(a)}}$('filter').onchange=render;fetch('./data.json').then(r=>r.json()).then(d=>{games=d.fixtures;render()}).catch(e=>$('count').textContent=e.message);</script></html>
