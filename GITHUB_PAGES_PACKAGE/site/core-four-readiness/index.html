<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sports Simulator · Core Four Readiness</title><style>body{background:#292b29;color:#f5f5f0;font:15px system-ui;margin:0}main{max-width:1000px;margin:auto;padding:20px}a{color:#86e8ed}h1{color:#baff70}.card{background:#383c37;padding:12px;border-radius:9px;margin:10px 0}small{color:#ccd0c9}</style><main><a href="../">← Beta</a><h1>🏆 Core Four · Data Readiness</h1><p>Fresh source snapshot when available. Exact-name matches and historical IDs from unknown providers are NOT verified joins. No new live forecasts are certified.</p><p id="summary">Loading...</p><div id="games"></div><script>const $=s=>document.getElementById(s);fetch('./data.json').then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(d=>{$('summary').textContent=d.count+' upcoming · '+d.strict_ESPN_pairs+' source-corroborated pairs · '+d.live_request_count+' successful feed requests · '+(d.source_fallback?'STALE FALLBACK':'FETCHED SNAPSHOT');for(const x of d.upcoming_events){let c=document.createElement('div');c.className='card';let h=document.createElement('strong');h.textContent=x.home+' vs '+x.away;let p=document.createElement('p');p.textContent=x.league+' · '+new Date(x.kickoff_utc).toLocaleString();let s=document.createElement('small');s.textContent=x.home_join_status+' / '+x.away_join_status+' · live forecast unavailable';c.append(h,p,s);$('games').append(c)}}).catch(e=>$('summary').textContent=e.message);</script></main></html>
