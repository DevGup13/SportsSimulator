<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sports Simulator | Data Quality</title><style>body{background:#292b29;color:#f8f8f1;font:15px system-ui;margin:0}main{max-width:970px;margin:auto;padding:24px}h1{color:#baff70}a{color:#83e8ed}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.card{border:1px solid #5c6259;border-radius:12px;padding:15px;background:#393c37}.big{font-size:27px;font-weight:800;color:#baff70}small{color:#c7cec5}table{border-collapse:collapse;width:100%}td,th{padding:9px;text-align:left;border-bottom:1px solid #555}.notice{border-left:3px solid #baff70;padding:12px;background:#364135}</style></head><body><main><a href="../">← Sports Simulator</a><h1>🔬 Data Quality Center</h1><p class="notice">Verified source coverage, not prediction accuracy. Player prop probabilities are unavailable until stat semantics and minutes are validated.</p><section class="grid" id="stats"></section><h2>Source stat-field availability</h2><div class="card" id="fields"></div><h2>Provider coverage</h2><div class="card" id="providers"></div><p><small>Historical schedule snapshot only, not automatically refreshed.</small></p><script>const $=x=>document.getElementById(x);function card(k,v){let n=document.createElement('div');n.className='card';let b=document.createElement('div');b.className='big';b.textContent=String(v);let p=document.createElement('small');p.textContent=k;n.append(b,p);$('stats').append(n)}function table(id,data){let root=$(id);let t=document.createElement('table');data.forEach(x=>{let tr=document.createElement('tr');let a=document.createElement('td');a.textContent=x.field;let b=document.createElement('td');b.textContent=x.rows.toLocaleString();tr.append(a,b);t.append(tr)});root.append(t)}fetch('./report.json').then(r=>{if(!r.ok)throw Error('Report HTTP '+r.status);return r.json()}).then(d=>{card('Historical player logs',d.log_rows.toLocaleString());card('Player IDs in logs',d.unique_player_ids_in_logs.toLocaleString());card('Approved stat rows',d.approved_stat_rows);card('Verified player minutes',d.explicit_playing_minutes_verified);card('Upcoming snapshot fixtures',d.snapshot_upcoming);card('Original simulations','657M');table('fields',d.raw_stat_keys);table('providers',d.providers)}).catch(e=>$('fields').textContent=e.message);</script></main></body></html>
